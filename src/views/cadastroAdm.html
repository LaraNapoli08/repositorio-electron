<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sectio Áurea</title>
  <link href="../public/css/style.css" rel="stylesheet">
  <script src="../public/js/sidebarimagem.js" defer></script>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=search" />
  

  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

</head>

<body>

 <div class="sidebar d-flex flex-column fw-bold">
    <img src="../public/img/userteste.png" alt="Foto do perfil" class="perfil-foto" id="fotoPerfil">
    <a href="paginainicialusuario.html"><i class="bi bi-people"></i> Lista de Usuários</a>
    <a href="cadastroAdm.html"><i class="bi bi-person-plus"></i> Cadastrar Administrador</a>
    <a href="editarperfil.html"><i class="bi bi-pencil-square"></i> Editar seu Perfil</a>
    <a href="estatisticas.html"><i class="bi bi-graph-up-arrow"></i> Estatisticas</a>
    <a href="duvidas.html"><i class="bi bi-envelope"></i> Feedbacks de Usuários</a>
    <a href="index.html"><i class="bi bi-box-arrow-right"></i> Sair de sua conta</a>
  </div>


  <div class="content">

    <div class="header">
      <h1>Cadastrar Administrador</h1>
      <p class="subtitle">Cadastre novos membros para o nosso time</p>
    </div>

    <div class="card-form">
      <form id="cadastroAdmForm" enctype="multipart/form-data">
        <div class="mb-3 text-start">
          <label class="form-label">Nome</label>
          <input type="text" class="form-control campos" id="nome" name="nome" required>
        </div>
        <div class="mb-3 text-start">
          <label class="form-label">E-mail</label>
          <input type="email" class="form-control campos" id="email" name="email" required maxlength="100">
        </div>
        <div class="mb-3 text-start">
          <label class="form-label">Senha</label>
          <input type="password" class="form-control campos" id="senha" name="senha" required>
        </div>
        <div class="mb-3 text-start">
          <label class="form-label">Foto de perfil</label>
          <input type="file" class="form-control campos" id="foto" name="foto" accept="image/*">
        </div>
        <button type="submit" class="btn-cadastrar">Cadastrar</button>
      </form>
      <div id="mensagem" class="mt-3"></div>
    </div>

  </div>

  <script src="../public/js/cadastrarAdm.js"></script>

</body>

</html>
